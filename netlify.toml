[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/analyse"
  to = "/.netlify/functions/analyse"
  status = 200

# Blokkeer directe publieke toegang tot resultaten en backend-bestanden op Netlify
[[redirects]]
  from = "/resultaten.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/app.py"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/config.json"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"

# Installeerbare webapp (PWA): manifest en service worker altijd vers ophalen
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "no-cache"
