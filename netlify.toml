[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["vragen.txt"]

[[redirects]]
  from = "/config.json"
  to = "/.netlify/functions/config"
  status = 200
  force = true

[[redirects]]
  from = "/api/vragen"
  to = "/.netlify/functions/vragen"
  status = 200

[[redirects]]
  from = "/api/analyse"
  to = "/.netlify/functions/analyse"
  status = 200
